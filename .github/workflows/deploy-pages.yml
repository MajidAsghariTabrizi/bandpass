name: Deploy Lab to Pages

on:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'fixtures/**'
      - 'src/**'
      - 'scripts/sync-lab.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Committed corpus must match the real compiler output.
      - name: Lab corpus sync check
        run: node scripts/sync-lab.mjs --check
      - name: Regenerate lab corpus from dist
        run: node scripts/sync-lab.mjs
      - name: Assemble site (root + /lab both resolve)
        run: |
          mkdir -p _site/lab
          cp -r lab/* _site/
          cp -r lab/* _site/lab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
