<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="bandpass pipeline: 33 sources are ranked by relevance, graded by evidence, resolved for conflicts and compressed into a 864-token Context Capsule with 14 rejections on the record">
  <style>
    text { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .brand { fill: #e6e3dc; font-size: 30px; font-weight: 700; letter-spacing: 6px; }
    .hook { fill: #ffb454; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .hook2 { fill: #8a877f; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .lbl { fill: #8a877f; font-size: 10.5px; letter-spacing: 2px; }
    .cnt { fill: #e6e3dc; font-size: 20px; font-weight: 700; }
    .cnt-amber { fill: #ffb454; }
    .cnt-red { fill: #ff5f56; }
    .stage { fill: #55534d; font-size: 11px; letter-spacing: 1.5px; }
    .cap { fill: #9ece6a; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
    .box { fill: none; stroke: #262626; stroke-width: 1; }
    .box-hard { fill: none; stroke: #3a3a3a; stroke-width: 1; }
    .band { fill: rgba(255,180,84,0.06); stroke: #ffb454; stroke-width: 1; stroke-dasharray: 3 3; }
    .tick-hot { stroke: #ffb454; stroke-width: 2; }
    .tick-dead { stroke: #4a4843; stroke-width: 1.5; opacity: 0.55; }

    .anim { opacity: 0; animation: appear 9s linear infinite; }
    .a1 { animation-delay: 0.3s; } .a2 { animation-delay: 1.4s; }
    .a3 { animation-delay: 2.6s; } .a4 { animation-delay: 3.8s; }
    .a5 { animation-delay: 5.0s; } .a6 { animation-delay: 6.2s; }
    .a7 { animation-delay: 7.2s; }
    @keyframes appear {
      0% { opacity: 0; } 4% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; }
    }
    .tick { animation: pulse 9s linear infinite; }
    @keyframes pulse { 0%,18% { opacity: 0.25; } 30%,88% { opacity: 1; } 100% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .anim, .tick { animation: none; opacity: 1; }
    }
  </style>

  <rect width="920" height="340" fill="#0b0b0b"/>
  <rect x="0.5" y="0.5" width="919" height="339" fill="none" stroke="#262626"/>

  <!-- header -->
  <text x="28" y="46" class="brand">bandpass</text>
  <text x="28" y="72" class="hook">COMPILE CONTEXT.</text>
  <text x="28" y="92" class="hook2">DON'T CONCATENATE IT.</text>
  <text x="892" y="46" text-anchor="end" class="lbl">CONTEXT COMPILER FOR AI AGENTS</text>
  <line x1="28" y1="106" x2="892" y2="106" stroke="#262626"/>

  <!-- pipeline stages -->
  <g class="anim a1">
    <text x="28" y="136" class="stage">RAW SOURCES</text>
    <text x="28" y="160" class="cnt">33</text>
    <text x="28" y="178" class="lbl">ITEMS · MEMORY · FILES · GIT · STATE</text>
  </g>
  <text x="150" y="152" class="stage">→</text>

  <g class="anim a2">
    <text x="172" y="136" class="stage">RANK</text>
    <text x="172" y="160" class="cnt">21</text>
    <text x="172" y="178" class="lbl">TASK DEFINES THE BAND</text>
  </g>
  <text x="284" y="152" class="stage">→</text>

  <g class="anim a3">
    <text x="306" y="136" class="stage">VERIFY</text>
    <text x="306" y="160" class="cnt">21</text>
    <text x="306" y="178" class="lbl">EVIDENCE GRADED</text>
  </g>
  <text x="418" y="152" class="stage">→</text>

  <g class="anim a4">
    <text x="440" y="136" class="stage">RESOLVE</text>
    <text x="440" y="160" class="cnt cnt-red">1×</text>
    <text x="440" y="178" class="lbl">JENKINS SUPERSEDED</text>
  </g>
  <text x="574" y="152" class="stage">→</text>

  <g class="anim a5">
    <text x="596" y="136" class="stage">COMPRESS</text>
    <text x="596" y="160" class="cnt">864</text>
    <text x="596" y="178" class="lbl">/ 1200 TOKENS · EST.</text>
  </g>

  <!-- capsule output -->
  <g class="anim a6">
    <rect x="716" y="120" width="176" height="72" class="box-hard"/>
    <text x="728" y="140" class="cnt cnt-amber" style="font-size:16px">19 SELECTED</text>
    <text x="728" y="158" class="lbl">14 REJECTED · ON RECORD</text>
    <text x="728" y="176" class="lbl">2 UNKNOWN · KEPT EXPLICIT</text>
  </g>

  <!-- spectrum with ticks -->
  <g class="anim a7">
    <rect x="28" y="216" width="864" height="46" class="box"/>
    <rect x="160" y="216" width="732" height="46" class="band"/>
    <text x="876" y="230" text-anchor="end" style="fill:#ffb454; font-size:8px; letter-spacing:2px">PASSBAND</text>
    <!-- in-band ticks (hot) -->
    <line x1="200" y1="224" x2="200" y2="254" class="tick tick-hot"/>
    <line x1="238" y1="224" x2="238" y2="254" class="tick tick-hot"/>
    <line x1="283" y1="224" x2="283" y2="254" class="tick tick-hot"/>
    <line x1="341" y1="224" x2="341" y2="254" class="tick tick-hot"/>
    <line x1="402" y1="224" x2="402" y2="254" class="tick tick-hot"/>
    <line x1="455" y1="224" x2="455" y2="254" class="tick tick-hot"/>
    <line x1="518" y1="224" x2="518" y2="254" class="tick tick-hot"/>
    <line x1="587" y1="224" x2="587" y2="254" class="tick tick-hot"/>
    <line x1="648" y1="224" x2="648" y2="254" class="tick tick-hot"/>
    <line x1="731" y1="224" x2="731" y2="254" class="tick tick-hot"/>
    <line x1="802" y1="224" x2="802" y2="254" class="tick tick-hot"/>
    <line x1="861" y1="224" x2="861" y2="254" class="tick tick-hot"/>
    <!-- out-of-band ticks (rejected) -->
    <line x1="48" y1="232" x2="48" y2="246" class="tick tick-dead"/>
    <line x1="66" y1="232" x2="66" y2="246" class="tick tick-dead"/>
    <line x1="84" y1="232" x2="84" y2="246" class="tick tick-dead"/>
    <line x1="102" y1="232" x2="102" y2="246" class="tick tick-dead"/>
    <line x1="120" y1="232" x2="120" y2="246" class="tick tick-dead"/>
    <line x1="138" y1="232" x2="138" y2="246" class="tick tick-dead"/>
    <!-- axis -->
    <text x="28" y="278" class="lbl" style="font-size:8.5px">RELEVANCE 0.0</text>
    <text x="460" y="278" class="lbl" text-anchor="middle" style="font-size:8.5px">0.5</text>
    <text x="892" y="278" class="lbl" text-anchor="end" style="font-size:8.5px">1.0</text>
  </g>

  <!-- footer -->
  <g class="anim a6">
    <text x="28" y="316" class="cap">▸ CONTEXT CAPSULE READY — EVERY REJECTION ON THE RECORD</text>
    <text x="892" y="316" text-anchor="end" class="lbl">npx github:MajidAsghariTabrizi/bandpass demo</text>
  </g>
</svg>
